services:
  - type: web
    name: weight-ai-backend
    runtime: python
    rootDir: M1-2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://copa.codyssey.kr/v1
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: 500
      - key: FIREBASE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/firebase-service-account.json
      - key: ALLOWED_ORIGINS
        sync: false

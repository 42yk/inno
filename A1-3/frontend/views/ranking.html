<section
  id="ranking"
  class="ranking section view active-view"
  data-view="ranking"
  aria-labelledby="ranking-title"
>
  <div class="section-heading">
    <p class="eyebrow">인기 메뉴 랭킹</p>
    <h2 id="ranking-title">많이 추천된 메뉴 TOP 10</h2>
  </div>
  <div class="ranking-shell">
    <div class="ranking-toolbar">
      <p id="ranking-message" role="status" aria-live="polite">랭킹을 불러오는 중입니다.</p>
      <button id="refresh-ranking" class="button secondary" type="button">새로고침</button>
    </div>
    <ol id="ranking-list" class="ranking-list" aria-label="인기 메뉴 TOP 10"></ol>
  </div>
</section>

services:
  ollama:
    image: ollama/ollama:latest
    container_name: b2-2-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: b2-2-n8n
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - .env
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: ${NEWS_TIMEZONE:-Asia/Seoul}
      TZ: ${NEWS_TIMEZONE:-Asia/Seoul}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      NEWS_CRON_EXPRESSION: ${NEWS_CRON_EXPRESSION:-0 9 * * *}
      NEWS_TIMEZONE: ${NEWS_TIMEZONE:-Asia/Seoul}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
      NOTION_API_TOKEN: ${NOTION_API_TOKEN}
      NOTION_NEWS_DB_ID: ${NOTION_NEWS_DB_ID}
      NOTION_RSS_CONFIG_DB_ID: ${NOTION_RSS_CONFIG_DB_ID}
      NOTION_TOPIC_CONFIG_DB_ID: ${NOTION_TOPIC_CONFIG_DB_ID}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  ollama_data:
  n8n_data:
